name: Foundation CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MIGRATION_DATABASE_URL: postgresql://kairn_migrator:local-migrator-only@127.0.0.1:55432/kairn
      PGBOSS_DATABASE_URL: postgresql://kairn_migrator:local-migrator-only@127.0.0.1:55432/kairn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Frozen dependency install
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm api:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:client-bundles
      - run: pnpm --dir apps/mobile exec expo install --check
      - run: bash tests/operations/packaged-links.sh
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm test:web
      - name: Firefox design system accessibility and interactions
        run: pnpm test:web tests/web/fold-atlas.playwright.ts --browser=firefox
      - name: Integration services
        run: docker compose -f infra/compose/dev.yml up -d --wait db storage mail
      - run: pnpm db:migrate
      - run: pnpm db:queue
      - run: pnpm test:web:identity
      - name: Web onboarding and Dashboard
        run: KAIRN_WEB_ONBOARDING=1 pnpm test:web:identity --workers=1
      - name: Firefox enlarged-text onboarding and invitation scans
        run: KAIRN_WEB_ONBOARDING=1 pnpm test:web:identity --browser=firefox --workers=1 -g "reflows both|can skip inviting"
      - name: Web invitation and membership recovery
        run: KAIRN_WEB_INVITATIONS=1 KAIRN_TEST_WEB_PORT=58084 KAIRN_TEST_API_PORT=58085 pnpm test:web:identity --workers=1
      - name: Web GPX journey lifecycle and accessibility
        env:
          KAIRN_WEB_RECORDINGS: "1"
          KAIRN_WEB_BATCHES: "1"
          KAIRN_TEST_WEB_BUILD_DIR: dist/gpx-ci
        run: |
          VITE_GPX_JOURNEY_CREATE=1 pnpm --filter @kairn/web exec vp build --outDir dist/gpx-ci
          pnpm test:web:identity --browser=chromium --workers=1
          pnpm test:web:identity --browser=firefox --workers=1
      - run: pnpm test:integration
      - run: pnpm test:identity:recovery
      - run: bash tests/integration/isolated-journeys.sh
      - name: Remove integration services
        if: always()
        run: docker compose -f infra/compose/dev.yml down -v

  release-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native Linux release images
        env:
          VITE_GPX_JOURNEY_CREATE: "1"
        run: bash infra/operations/build-images.sh linux/amd64 kairn-ci "${RUNNER_TEMP}/kairn-release.env"
      - name: Release smoke and coordinated restore
        run: bash tests/operations/release.sh "${RUNNER_TEMP}/kairn-release.env"
