<!doctype html>
<html lang="en-IN" data-appearance="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kairn · Journey foundations</title>
<link rel="stylesheet" href="../../packages/design-tokens/generated/tokens.css">
<style>
@font-face {
  font-family: "Source Sans 3";
  src: url("../../packages/design-tokens/fonts/source-sans-3.woff2") format("woff2");
  font-weight: 200 900;
  font-display: swap;
}
* { box-sizing: border-box; }
body { margin: 0; font: 1rem/1.5 "Source Sans 3", system-ui, sans-serif; }
main { max-width: 52rem; margin: auto; }
.chapter { color: var(--kairn-semantic-color-ink); background: var(--kairn-semantic-color-canvas); padding: clamp(16px, 3.8vw, 32px); border-radius: 12px; }
header, .folio, .facts, figcaption { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
header { padding-bottom: 14px; border-bottom: var(--kairn-semantic-border-control) solid var(--kairn-semantic-color-boundary); }
.brand { font-size: 1.375rem; font-weight: 600; }
label, .meta, figcaption, .detail, .note { font-size: .875rem; }
select { color: var(--kairn-semantic-color-ink); background: var(--kairn-semantic-color-surface); font: inherit; min-height: 44px; border: var(--kairn-semantic-border-control) solid var(--kairn-semantic-color-boundary); border-radius: 8px; padding: 0 8px; margin-left: 6px; }
:focus-visible { outline: 3px solid var(--kairn-semantic-color-information); outline-offset: 3px; }
.folio { margin-top: 18px; color: var(--kairn-semantic-color-story-accent); font-weight: 600; }
h1 { font: 400 clamp(2.25rem, 6vw, 3.1rem)/1.15 Georgia, serif; margin: 6px 0; }
.place { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; color: var(--kairn-semantic-color-secondary-text); margin: 4px 0 16px; }
.icon { flex: none; width: 20px; height: 20px; }
figure { margin: 0; }
.photo { height: auto; display: block; width: 100%; aspect-ratio: 2.65; object-fit: cover; border-radius: 12px; }
figcaption { color: var(--kairn-semantic-color-secondary-text); margin: 6px 0 18px; }
a { color: inherit; text-underline-offset: .16em; }
.facts { display: grid; grid-template-columns: 1.2fr 1fr; align-items: stretch; gap: 14px; }
article, .route { padding: 16px; background: var(--kairn-semantic-color-surface); border-radius: 12px; border: var(--kairn-semantic-border-control) solid var(--kairn-semantic-color-boundary); }
h2 { display: flex; align-items: center; gap: 8px; font-size: 1rem; font-weight: 600; margin: 0 0 8px; }
.value { font-size: 1.7rem; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; }
.detail { color: var(--kairn-semantic-color-secondary-text); margin: 4px 0 0; }
.route svg.diagram { display: block; width: 100%; height: 46px; }
.legend { display: flex; gap: 4px 14px; flex-wrap: wrap; font-size: .875rem; }
.key { display: inline-flex; align-items: center; gap: 5px; }
.key::before { content: ""; width: 1.25rem; border-top: 3px solid var(--kairn-semantic-color-action); }
.key.estimated::before { border-top: 3px dashed var(--kairn-semantic-color-information); }
.note { margin: 12px 0 0; color: var(--kairn-semantic-color-secondary-text); }
@media (max-width: 500px) {
  .facts { grid-template-columns: 1fr; }
  .photo { aspect-ratio: 1.9; }
}
</style>
</head>
<body>
<main>
<section class="chapter" aria-labelledby="chapter-title">
  <header>
    <span class="brand">Kairn</span>
    <label>Appearance <select id="theme"><option>Light</option><option>Dark</option><option>Outdoor</option></select></label>
  </header>
  <div class="folio meta"><span>Day 2 · Transfer</span><span>12 Jun 2026</span></div>
  <h1 id="chapter-title">The road to Coonoor</h1>
  <p class="place"><svg aria-hidden="true" class="icon"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" />
  <circle cx="12" cy="10" r="3" />
</svg> Coonoor <span aria-hidden="true">·</span> <span lang="ta">குன்னூர்</span></p>
  <figure>
    <img class="photo" src="assets/coonoor.jpg" width="960" height="541" alt="Tea fields across the hillside below houses in Coonoor.">
    <figcaption><span>Tea country, the Nilgiris</span><a href="https://commons.wikimedia.org/wiki/File:Hill_Station_Landscape_in_Coonoor,_Tamil_Nadu.jpg">Photo by JesusisGreat7 · CC0</a></figcaption>
  </figure>
  <div class="facts">
    <div class="route">
      <h2><svg aria-hidden="true" class="icon"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M9 5h8.5a1 1 0 010 7h-11a1 1 0 000 7H15" />
  <circle cx="18" cy="19" r="3" />
  <circle cx="6" cy="5" r="3" />
</svg> Route evidence</h2>
      <svg class="diagram" viewBox="0 0 270 46" role="img" aria-label="Schematic. Two recorded sections with a gap. The final connection is estimated.">
        <path d="M9 34 C33 34 25 9 51 12 S80 38 103 22 M132 18 Q151 2 169 11 T202 20" fill="none" stroke="var(--kairn-semantic-color-action)" stroke-width="4" stroke-linecap="round"/>
        <path d="M202 20 Q225 37 259 15" fill="none" stroke="var(--kairn-semantic-color-information)" stroke-width="3" stroke-dasharray="6 4"/>
        <g stroke="var(--kairn-semantic-color-action)" stroke-width="3" fill="var(--kairn-semantic-color-surface)"><circle cx="9" cy="34" r="4"/><circle cx="202" cy="20" r="5"/></g>
      </svg>
      <div class="legend"><span class="key">Recorded</span><span class="key estimated">Estimated</span></div>
      <p class="detail">A break marks a gap in the track.</p>
    </div>
    <article>
      <h2><svg aria-hidden="true" class="icon"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <rect width="20" height="12" x="2" y="6" rx="2" />
  <circle cx="12" cy="12" r="2" />
  <path d="M6 12h.01M18 12h.01" />
</svg> Shared taxi</h2>
      <div class="value">₹2,400</div>
      <div>per vehicle · 4 passengers</div>
      <p class="detail">Reported by Anu · 12 Jun 2026</p>
    </article>
  </div>
  <p class="note">Design sample. Journey details and route are illustrative.</p>
</section>
</main>
<script>
document.querySelector("#theme").addEventListener("change", (event) => {
  document.documentElement.dataset.appearance = event.target.value.toLowerCase();
});
</script>
</body>
</html>
