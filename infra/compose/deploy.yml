name: ${KAIRN_PROJECT:?Set the environment project name}

services:
  db:
    image: ${KAIRN_DB_IMAGE:?Set the database image}
    platform: ${KAIRN_PLATFORM:?Set the Linux platform}
    restart: unless-stopped
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=60s
      - -c
      - archive_command=pgbackrest --stanza=kairn archive-push %p
    env_file:
      - path: ${KAIRN_DB_ENV:?Set the database environment file}
        format: raw
    environment:
      POSTGRES_DB: kairn
      POSTGRES_USER: kairn_admin
    volumes:
      - postgres:/var/lib/postgresql/data
      - pgbackrest:/var/lib/pgbackrest
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/10-kairn.sql:ro
      - ./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "kairn_admin",
          "-d",
          "kairn",
        ]
      interval: 2s
      timeout: 3s
      retries: 45

  storage:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    platform: ${KAIRN_PLATFORM}
    restart: unless-stopped
    command: ["mini", "-dir=/data", "-master.telemetry=false"]
    env_file:
      - path: ${KAIRN_STORAGE_ENV:?Set the object storage environment file}
        format: raw
    volumes:
      - seaweedfs:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 2s
      timeout: 3s
      retries: 45

  server:
    image: ${KAIRN_SERVER_IMAGE:?Set the server image}
    platform: ${KAIRN_PLATFORM}
    restart: unless-stopped
    init: true
    env_file:
      - path: ${KAIRN_SERVER_ENV:?Set the server environment file}
        format: raw
    environment:
      NODE_ENV: production
    networks: [default, ingress]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/ready').then(r => {if (!r.ok) process.exit(1)})",
        ]
      interval: 5s
      timeout: 3s
      retries: 18

  worker:
    image: ${KAIRN_WORKER_IMAGE:?Set the worker image}
    platform: ${KAIRN_PLATFORM}
    restart: unless-stopped
    init: true
    env_file:
      - path: ${KAIRN_WORKER_ENV:?Set the worker environment file}
        format: raw
    environment:
      NODE_ENV: production
      KAIRN_WORKER_READY_FILE: /run/kairn/ready
    tmpfs:
      - /run/kairn:uid=1000,gid=1000,mode=0700
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/kairn/ready"]
      interval: 5s
      timeout: 3s
      retries: 18

  edge:
    image: ${KAIRN_EDGE_IMAGE:?Set the edge image}
    platform: ${KAIRN_PLATFORM}
    restart: unless-stopped
    environment:
      KAIRN_SITE_ADDRESS: ${KAIRN_SITE_ADDRESS:?Set the Caddy site address}
    ports:
      - "${KAIRN_BIND_ADDRESS:-0.0.0.0}:${KAIRN_HTTP_PORT:-80}:${KAIRN_HTTP_TARGET:-80}"
      - "${KAIRN_BIND_ADDRESS:-0.0.0.0}:${KAIRN_HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [ingress]

  ops:
    image: ${KAIRN_OPS_IMAGE:?Set the operations image}
    platform: ${KAIRN_PLATFORM}
    profiles: [ops]
    env_file:
      - path: ${KAIRN_MIGRATION_ENV:?Set the migration environment file}
        format: raw

  object-backup:
    image: &restic_image restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
    platform: ${KAIRN_PLATFORM}
    profiles: [ops]
    env_file:
      - path: ${KAIRN_RESTIC_ENV:?Set the backup environment file}
        format: raw
    volumes:
      - seaweedfs:/objects:ro

  object-restore:
    image: *restic_image
    platform: ${KAIRN_PLATFORM}
    profiles: [restore]
    env_file:
      - path: ${KAIRN_RESTIC_ENV:?Set the backup environment file}
        format: raw
    volumes:
      - seaweedfs:/restore/objects

networks:
  ingress:

volumes:
  postgres:
  pgbackrest:
  seaweedfs:
  caddy-data:
  caddy-config:
